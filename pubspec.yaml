name: easy_grade
description: >
  App de correção automatizada de provas
publish_to: 'none'
version: 1.0.0+6

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.2.4
  vector_graphics: ^1.2.3
  intl: ^0.20.2
  cupertino_icons: ^1.0.6
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  google_sign_in: ^7.2.0
  image_picker: ^1.2.4
  google_mlkit_barcode_scanning: ^0.16.1
  image: ^4.3.0
  qr_flutter: ^4.1.0
  pdf: ^3.12.0
  printing: ^5.14.3
  excel: ^4.0.6
  file_picker: ^13.3.0
  share_plus: ^13.3.1
  archive: ^3.6.1
  zxing2: ^0.2.4
  csv: ^8.0.0
  path_provider: ^2.1.6
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - SVG/
    - assets/images/correcao_giz.png
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
